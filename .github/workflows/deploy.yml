name: Validate and build API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Offline API tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU PyTorch
        run: python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Run API tests
        run: python -m unittest test_chat_api -v

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          df -h /
          docker system prune --all --force
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ragbot-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/ragbot-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS host
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Create runtime environment file
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Add GEMINI_API_KEY to the repository Actions secrets."
            exit 1
          fi
          {
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'GEMINI_MODEL=%s\n' 'gemini-3.5-flash-lite'
            printf 'HF_EMBEDDING_MODEL=%s\n' 'intfloat/multilingual-e5-base'
            printf 'CHROMA_COLLECTION_NAME=%s\n' 'documents'
            printf 'LANGFUSE_PUBLIC_KEY=%s\n' "$LANGFUSE_PUBLIC_KEY"
            printf 'LANGFUSE_SECRET_KEY=%s\n' "$LANGFUSE_SECRET_KEY"
            printf 'LANGFUSE_BASE_URL=%s\n' 'https://cloud.langfuse.com'
          } > .env
          chmod 600 .env

      - name: Check registry pull credential
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          if [ -z "$GHCR_READ_TOKEN" ]; then
            echo "Add GHCR_READ_TOKEN as a classic GitHub PAT with read:packages permission."
            exit 1
          fi

      - name: Copy runtime environment file to AWS host
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: ".env"
          target: "/tmp/ragbot-deploy"
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ragbot-api
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_NAME,IMAGE_TAG
          script: |
            set -e
            mkdir -p "$HOME/ragbot"
            install -m 600 /tmp/ragbot-deploy/.env "$HOME/ragbot/.env"
            rm -rf /tmp/ragbot-deploy
            cd "$HOME/ragbot"
            echo "Docker pull target: $(hostname) (AWS host)"
            df -h / "$HOME"
            sudo docker system df
            sudo docker builder prune --all --force
            sudo docker rm -f ragbot-api || true
            sudo docker image ls "$IMAGE_NAME" --quiet | sort -u | xargs -r sudo docker image rm --force
            df -h / "$HOME"
            sudo docker system df
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            sudo docker pull "$IMAGE_NAME:$IMAGE_TAG"
            sudo docker logout ghcr.io
            sudo docker run --rm \
              --env-file "$HOME/ragbot/.env" \
              --entrypoint python \
              "$IMAGE_NAME:$IMAGE_TAG" \
              -c 'from app.db.vector_db import get_collection; collection=get_collection(); count=collection.count(); print(f"Chroma chunks={count}"); raise SystemExit(0 if count else 1)'
            sudo docker run -d \
              --name ragbot-api \
              --restart unless-stopped \
              --env-file "$HOME/ragbot/.env" \
              -p 8000:8000 \
              --mount "type=bind,source=$HOME/.cache/huggingface,target=/root/.cache/huggingface,readonly" \
              "$IMAGE_NAME:$IMAGE_TAG"
