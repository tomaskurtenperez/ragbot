name: Validate and build API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Offline API tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run API tests
        run: python -m unittest test_chat_api -v

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          df -h /
          docker system prune --all --force
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Build image
        run: docker build --tag ragbot-api:${GITHUB_SHA} .

  deploy:
    name: Deploy to AWS host
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create runtime environment file
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Add GEMINI_API_KEY to the repository Actions secrets."
            exit 1
          fi
          {
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'GEMINI_MODEL=%s\n' 'gemini-3.5-flash-lite'
            printf 'HF_EMBEDDING_MODEL=%s\n' 'intfloat/multilingual-e5-base'
            printf 'CHROMA_COLLECTION_NAME=%s\n' 'documents'
            printf 'LANGFUSE_PUBLIC_KEY=%s\n' "$LANGFUSE_PUBLIC_KEY"
            printf 'LANGFUSE_SECRET_KEY=%s\n' "$LANGFUSE_SECRET_KEY"
            printf 'LANGFUSE_BASE_URL=%s\n' 'https://cloud.langfuse.com'
          } > .env
          chmod 600 .env

      - name: Copy application files to AWS host
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "Dockerfile,requirements.txt,.dockerignore,.env,app,data"
          target: "/tmp/ragbot-deploy"
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -e
            mkdir -p "$HOME/ragbot"
            cp -a /tmp/ragbot-deploy/. "$HOME/ragbot/"
            rm -rf /tmp/ragbot-deploy
            cd "$HOME/ragbot"
            test -f .env || { echo "Missing $HOME/ragbot/.env on the AWS host."; exit 1; }
            sudo docker build -t ragbot-api:latest .
            sudo docker rm -f ragbot-api || true
            sudo docker run -d \
              --name ragbot-api \
              --restart unless-stopped \
              --env-file "$HOME/ragbot/.env" \
              -p 8000:8000 \
              --mount "type=bind,source=$HOME/.cache/huggingface,target=/root/.cache/huggingface,readonly" \
              --mount "type=bind,source=$HOME/ragbot/data/chroma_db,target=/app/data/chroma_db" \
              ragbot-api:latest
